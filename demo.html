<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FindMyCar Demo</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(160deg, #dcebe7 0%, #f7faf8 45%, #dfe9e3 100%);
      color: #10201d;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .phone {
      position: relative;
      width: min(390px, calc(100vw - 28px));
      min-height: 760px;
      overflow: hidden;
      padding: 20px;
      border: 10px solid #111827;
      border-radius: 42px;
      background: linear-gradient(180deg, rgba(15, 118, 110, .22), #f7f7f4 42%, #eef3ef);
      box-shadow: 0 24px 70px rgba(16, 32, 29, .28);
    }
    header { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
    .logo {
      width: 52px; height: 52px; display: grid; place-items: center;
      border-radius: 16px; background: #0f766e; color: white;
      font-size: 28px; font-weight: 900;
    }
    h1, h2, p { margin: 0; }
    h1 { font-size: 27px; letter-spacing: 0; }
    header p { margin-top: 2px; color: #5f6f69; }
    .language {
      margin-left: auto; width: 44px; height: 44px; border: 0;
      border-radius: 999px; background: rgba(255, 255, 255, .78); font-size: 20px;
    }
    .ad {
      height: 72px; display: grid; place-items: center; margin-bottom: 18px;
      border: 1px solid rgba(16, 32, 29, .08); border-radius: 18px;
      background: rgba(255, 255, 255, .72); color: #6b7280;
      font-size: 13px; font-weight: 800;
    }
    .action {
      min-height: 172px; display: flex; flex-direction: column; justify-content: space-between;
      margin-bottom: 14px; padding: 20px; border-radius: 20px; color: white;
      box-shadow: 0 18px 34px rgba(16, 32, 29, .18);
    }
    .primary { background: #0f766e; }
    .blue { background: #2563eb; }
    .top { display: flex; justify-content: space-between; align-items: center; font-size: 32px; }
    .icon {
      width: 60px; height: 60px; display: grid; place-items: center;
      border-radius: 18px; background: rgba(255, 255, 255, .16);
    }
    .action h2 { margin-bottom: 8px; font-size: 25px; letter-spacing: 0; }
    .action p { color: rgba(255, 255, 255, .84); line-height: 1.25; }
    nav {
      position: absolute; left: 0; right: 0; bottom: 0;
      display: grid; grid-template-columns: repeat(5, 1fr);
      padding: 10px 8px 16px; background: rgba(255, 255, 255, .86);
      backdrop-filter: blur(12px); color: #64706b;
      font-size: 11px; font-weight: 800; text-align: center;
    }
    nav span:first-child { color: #0f766e; }
  </style>
</head>
<body>
  <main class="phone" aria-label="Demo FindMyCar">
    <header>
      <div class="logo">F</div>
      <div><h1>FindMyCar</h1><p>Trovo la mia auto</p></div>
      <button class="language" aria-label="Lingua">◎</button>
    </header>
    <section class="ad">Pubblicita</section>
    <section class="action primary">
      <div class="top"><div class="icon">⌖</div><div>›</div></div>
      <div><h2>Memorizza posizione auto</h2><p>Salva la posizione precisa della tua auto.</p></div>
    </section>
    <section class="action blue">
      <div class="top"><div class="icon">➤</div><div>›</div></div>
      <div><h2>Trova la mia auto</h2><p>Apri la mappa interna con auto e posizione attuale.</p></div>
    </section>
    <nav aria-label="Navigazione demo">
      <span>⌂<br>Home</span><span>↺<br>Cronologia</span><span>★<br>Preferiti</span><span>↗<br>Condividi</span><span>⚙<br>Impost.</span>
    </nav>
  </main>
</body>
</html>
